[project]
name = "agentic-ai-platform"
version = "0.1.0"
description = "Production-Ready Agentic AI Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "streamlit>=1.38.0",
    "groq>=0.11.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-groq>=0.2.0",
    "langgraph>=0.2.20",
    "langchain-mcp-adapters>=0.1.0",
    "mcp>=1.0.0",
    "mcp-server-sqlite>=2025.4.25",
    "tavily-python>=0.8.0",
    "chromadb>=0.5.5",
    "sentence-transformers>=3.0.1",
    "sqlalchemy>=2.0.32",
    "requests>=2.32.3",
    "ipykernel>=6.29.5",
    "pytest>=8.3.2",
    "httpx>=0.27.0"
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
