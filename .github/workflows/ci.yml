# ── Phase 9 — GitHub Actions CI/CD ───────────────────────────────────────────
#
# Pipeline:
#   1. lint      → ruff (fast Python linter)
#   2. test      → pytest (unit + API tests)
#   3. docker    → build both images; on push to main/develop also push them to Docker Hub
#
# Triggers:
#   - push to main or develop
#   - any pull request targeting main
#
# Secrets required in GitHub → Settings → Secrets and variables → Actions:
#   DOCKERHUB_USERNAME  (your Docker Hub username)
#   DOCKERHUB_TOKEN     (Docker Hub access token with Read & Write scope)
# Optional (tests use dummy keys if these are missing):
#   GROQ_API_KEY, TAVILY_API_KEY, LANGCHAIN_API_KEY
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:

  # ── Job 1: Lint ─────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check backend/ frontend/ tests/ --ignore E501

  # ── Job 2: Test ─────────────────────────────────────────────────────────────
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Create required directories
        run: mkdir -p data/uploads chroma_db

      - name: Run tests
        env:
          # Inject secrets from GitHub Actions — tests that need LLM use these
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY:     ${{ secrets.TAVILY_API_KEY }}
          LANGCHAIN_API_KEY:  ${{ secrets.LANGCHAIN_API_KEY }}
          LANGCHAIN_TRACING_V2: "false"   # disable tracing in CI
          HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
        run: pytest tests/ -v --tb=short

  # ── Job 3: Docker Build (+ push to Docker Hub on push events) ───────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: test
    env:
      # Push only for push events (never for pull requests, which have no secrets)
      PUSH_IMAGES: ${{ github.event_name == 'push' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Backend image metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/agentic-ai-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch

      - name: Frontend image metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/agentic-ai-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: ${{ env.PUSH_IMAGES == 'true' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: ${{ env.PUSH_IMAGES == 'true' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
